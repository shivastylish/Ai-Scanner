[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ai-screener"
version = "0.2.0-dev"
description = "AI-powered market research platform for equities, mutual funds, and crypto."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Shiva" }
]
keywords = [
    "stocks",
    "trading",
    "ai",
    "finance",
    "nse",
    "market",
]

dependencies = [
    "pandas>=2.3.0",
    "numpy>=2.3.0",
    "sqlalchemy>=2.0.41",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.1.0",
    "yfinance>=1.5.2",
    "alembic>=1.13.0",
    "pyside6>=6.11.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "black>=25.1.0",
    "ruff>=0.12.0",
    "isort>=6.0.0",
    "mypy>=1.17.0",
    "pandas-stubs>=2.3.0",
    "pytest-qt>=4.5.0",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: hits a live network/external service; excluded from the default run",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "yfinance.*"
ignore_missing_imports = true
